
<div class="d-flex justify-content-center align-items-center flex-column" style="min-height: 100vh;">
    <h1 class="mb-4">Profil</h1>
    <form style="width: 66%; border: 3px solid #0d6efd; border-radius: 10px; padding: 2rem;" (ngSubmit)="modifierProfil()">

        <div class="profile-pic-wrapper d-flex justify-content-center mb-4">
            <div class="profile-pic-container position-relative" (click)="openModal()">
              <img 
                [src]="selectedProfilePic" 
                alt="Photo de profil" 
                class="rounded-circle profile-pic-img">
              <div class="overlay">
                <span>Modifier</span>
              </div>
            </div>
          </div>

      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Adresse Email</label>
        <input type="email" class="form-control" id="exampleInputEmail1" name="mail" [(ngModel)]="registerData.mail" required>
      </div>
      
      <div class="mb-3">
        <div class="d-flex gap-3">
          <div class="flex-fill">
            <label for="inputNom" class="form-label">Nom</label>
            <input type="text" class="form-control" id="inputNom" name="nom" [(ngModel)]="registerData.nom" required>
          </div>
          <div class="flex-fill">
            <label for="inputPrenom" class="form-label">Prénom</label>
            <input type="text" class="form-control" id="inputPrenom" name="prenom" [(ngModel)]="registerData.prenom" required>
          </div>
        </div>
      </div>
      
      
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Mot de Passe</label>
        <input type="password" class="form-control" id="exampleInputPassword1" name="mdp" [(ngModel)]="registerData.mdp"
          placeholder="Laisser vide pour ne pas le changer">
      </div>
    
      
      <div *ngIf="message" class="alert alert-success py-2">{{ message }}</div>
      <div *ngIf="erreur" class="alert alert-danger py-2">{{ erreur }}</div>
      <button type="submit" class="btn btn-primary">Modifier le profil</button>
    </form>
  </div>
  
<!-- Modal -->
<div *ngIf="isModalOpen" class="modal-backdrop" (click)="closeModal()">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h5 class="modal-title">Choisir une photo</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <img 
              *ngFor="let pic of availablePics" 
              [src]="pic" 
              (click)="selectPic(pic)" 
              class="rounded-circle profile-pic-thumbnail"
              style="cursor: pointer;">
          </div>
        </div>
      </div>
    </div>
  </div>
