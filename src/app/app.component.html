<nav class="navbar bg-body-tertiary">
  <div class="container position-relative justify-content-center">
    <!-- Modes de jeu à gauche, compte à droite : le titre centré n'est plus chevauché -->
    <div *ngIf="isConnecter" class="me-auto d-flex align-items-center gap-1">
      <a routerLink="/capture" class="btn btn-sm btn-success fw-bold">Capture</a>
      <a routerLink="/pokedex" class="btn btn-sm btn-outline-danger">Pokédex</a>
      <a routerLink="/donjons" class="btn btn-sm btn-dark">Donjons</a>
      <a routerLink="/versus" class="btn btn-sm btn-outline-primary">Versus</a>
      <a routerLink="/boss" class="btn btn-sm btn-warning fw-bold">Boss final</a>
    </div>

    <!-- Dynamique du routerLink basé sur isConnecter -->
    <a [routerLink]="isConnecter ? '/liste-equipes' : '/accueil'"
      class="navbar-brand position-absolute start-50 translate-middle-x fs-1 fw-bold text-decoration-none">
      Pocket'APP
    </a>

    <div class="ms-auto d-flex align-items-center">
      <!-- Afficher le bouton "Se Connecter" quand isConnecter est false -->
      <button *ngIf="!isConnecter" class="btn btn-primary" (click)="openLoginModal()">Se Connecter</button>

      <!-- Afficher l'avatar quand isConnecter est true -->
      <div *ngIf="isConnecter" class="d-flex align-items-center">
        <a [routerLink]="'/profil'" class="d-flex align-items-center">
          <img [src]="photoProfil" alt="Profil" class="rounded-circle"
            style="width: 40px; height: 40px; object-fit: cover;">
        </a>
        <button type="button" class="btn btn-sm btn-danger ms-2" (click)="logout()">Se déconnecter</button>
      </div>
    </div>
  </div>
</nav>


<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Connexion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
      </div>

      <div class="modal-body">
        <form (ngSubmit)="login()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="email" class="form-label">Adresse mail</label>
            <input type="email" [(ngModel)]="registerData.mail" name="mail" id="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Mot de passe</label>
            <input type="password" [(ngModel)]="registerData.mdp" name="mdp" id="password" class="form-control"
              required />
          </div>


          <div *ngIf="loginError" class="alert alert-danger py-2">{{ loginError }}</div>

          <button type="submit" class="btn btn-primary w-100">Se connecter</button>

        </form>
      </div>


    </div>
  </div>
</div>

<router-outlet></router-outlet>
