<div class="mt-3 p-3 border rounded bg-light">
    <div class="d-flex justify-content-end m-3">
        <button class="btn btn-primary" [routerLink]="['/liste-equipes']">
            Retour
        </button>
    </div>
    <div class="input-group mb-3" style="max-width: 500px; height: 50px; cursor: pointer;">
        <span class="input-group-text" id="basic-addon1">Equipe : </span>
        <input type="text" class="form-control" placeholder="Nom de l'équipe" name="nomEquipe" id="nomEquipe">
    </div>

    <div class="d-flex justify-content-between align-items-start">

        <div class="d-flex gap-2 align-items-center flex-wrap">
            <div class="d-flex gap-2 align-items-center flex-wrap">
                <div *ngFor="let member of equipe"
                    class="text-center justify-content-center d-flex flex-column align-items-center">
                    <img *ngIf="member" [src]="member.image" alt="{{ member.name }}" class="rounded-circle border"
                        style="width: 100px; height: 100px;">

                    <img *ngIf="!member" src="img/empty.png" alt="Emplacement vide" class="rounded-circle border"
                        style="width: 100px; height: 100px; opacity: 0.3;">

                    <small class="text-capitalize">{{ member?.name || 'Vide' }}</small>
                </div>
            </div>



            <div class="d-flex flex-column gap-2">
                <button class="btn btn-primary btn-lg w-100" style="padding: 1rem" (click)="newTeam()">Valider</button>
                <button class="btn btn-danger btn-lg w-100" style="padding: 1rem">Annuler</button>
            </div>


        </div>
    </div>
</div>


<div class="m-5 p-3 border rounded bg-light">

    <!-- Barre de recherche / Boutons de tri par Types ou Génération-->
    <div class="d-flex justify-content-around">
        <div class="input-group mb-3" style="max-width: 500px; height: 50px; cursor: pointer;">
            <input type="text" class="form-control" placeholder="Rechercher" name="rechercherPoke" id="rechercherPoke"
                [(ngModel)]="searchText" (input)="filterPokemons()">
        </div>

        <div class="text-center ">
            <button type="button" class="btn btn-lg" [ngClass]="getTypeColor(currentType)" (click)="typeSuivant()">
                {{ currentType ? currentType : 'Type' }}
            </button>

        </div>
        <div>
            <button type="button" class="btn btn-secondary btn-lg" (click)="changeGeneration()">Generation : {{this.id}}</button>
        </div>
    </div>

    <!-- affichage des pokemon avec hover d'ajout ou de détail-->
    <div class="d-flex flex-wrap justify-content-center gap-4">
        <div *ngFor="let poke of pokemons"
            class="pokemon-card text-center d-flex flex-column align-items-center position-relative">

            <img [src]="poke.image" alt="{{ poke.name }}" class="rounded-circle border"
                style="width: 100px; height: 100px; object-fit: cover;">


            <div class="hover-actions d-flex flex-column justify-content-center align-items-center">
                <button class="btn btn-primary btn-sm mb-2" (click)="addToTeam(poke)">Ajouter</button>
                <button class="btn btn-warning btn-sm" (click)="viewDetails(poke)">Détails</button>
            </div>

            <small class="text-capitalize mt-2">{{ poke.name }}</small>

        </div>
    </div>

</div>
