<div class="team-card p-3 border rounded bg-light">
  <h5>{{team.nom}} <span *ngIf="team.isPublic" class="badge bg-secondary align-middle fs-6">Publique</span></h5>

  <div class="d-flex justify-content-between align-items-start">

    <div class="d-flex gap-2 align-items-center flex-wrap">
      <div *ngFor="let pokemon of team.members"
        class="text-center justify-content-center d-flex flex-column align-items-center">
        <div class="position-relative">
          <img [src]="pokemon.sprite" [alt]="pokemon.name" class="rounded-circle border"
            style="width: 50px; height: 50px;">
          <span *ngIf="pokemon.isMega" class="badge badge-mega position-absolute top-0 start-50 translate-middle-x">M</span>
        </div>
        <small>{{ pokemon.name | nomPokemon }}</small>
      </div>
    </div>

    <div class="d-flex flex-column gap-2">
      <button class="btn btn-primary btn-sm w-100" [routerLink]="['/versus']" [queryParams]="{ a: team.idTeam }">Combattre</button>
      <button class="btn btn-danger btn-sm w-100" (click)="supprimerTeam(team.idTeam)">Supprimer</button>
    </div>

  </div>
</div>
