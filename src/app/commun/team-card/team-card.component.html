<div class="team-card p-3 border rounded bg-light">
  <h5>{{team.nom}}</h5>

  <div class="d-flex justify-content-between align-items-start">

    <div class="d-flex gap-2 align-items-center flex-wrap">
      <div *ngFor="let pokemon of pokeResultArray"
        class="text-center justify-content-center d-flex flex-column align-items-center">
        <img [src]="pokemon[0][1]" [alt]="pokemon[0][0]" class="rounded-circle border"
          style="width: 50px; height: 50px;">
        <small class="text-capitalize">{{ pokemon[0][0] }}</small>
      </div>

      <div
        class="d-flex justify-content-center align-items-center border rounded-circle"
        style="width: 50px; height: 50px; cursor: pointer;">
        <button (click)="onAddPokemon()"
          class="btn btn-light rounded-circle border d-flex justify-content-center align-items-center"
          style="width: 50px; height: 50px;">
          <span class="fs-4">+</span>
        </button>
      </div>
    </div>

    <div class="d-flex flex-column gap-2">
      <button class="btn btn-primary btn-sm w-100">Modifier</button>
      <button class="btn btn-danger btn-sm w-100" (click)="supprimerTeam(team.idTeam)">Supprimer</button>
    </div>

  </div>
</div>
