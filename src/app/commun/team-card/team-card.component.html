<div class="team-card p-3 border rounded bg-light">
  <h5>{{team.nom}} <span *ngIf="team.isPublic" class="badge bg-secondary align-middle fs-6">Publique</span>
    <span *ngIf="team.locked?.length" class="badge bg-dark align-middle fs-6">🔒 Verrouillée</span></h5>
  <p *ngIf="team.locked?.length" class="small text-muted mb-2">
    Pas encore capturés :
    <ng-container *ngFor="let n of team.locked; let last = last">{{ n | nomPokemon }}{{ last ? '' : ', ' }}</ng-container>.
    Capture-les pour pouvoir combattre avec cette équipe.
  </p>

  <div class="d-flex justify-content-between align-items-start">

    <div class="d-flex gap-2 align-items-center flex-wrap">
      <div *ngFor="let pokemon of team.members" [class.membre-verrouille]="team.locked?.includes(pokemon.name)"
        class="text-center justify-content-center d-flex flex-column align-items-center">
        <div class="position-relative">
          <img [src]="pokemon.sprite" [alt]="pokemon.name" class="rounded-circle border"
            style="width: 50px; height: 50px;">
          <span *ngIf="pokemon.isMega" class="badge badge-mega position-absolute top-0 start-50 translate-middle-x">M</span>
        </div>
        <small>{{ pokemon.name | nomPokemon }}</small>
      </div>
    </div>

    <div class="d-flex flex-column gap-2">
      <button class="btn btn-primary btn-sm w-100" [routerLink]="['/versus']" [queryParams]="{ a: team.idTeam }"
        [disabled]="team.locked?.length">Combattre</button>
      <button class="btn btn-danger btn-sm w-100" (click)="supprimerTeam(team.idTeam)">Supprimer</button>
    </div>

  </div>
</div>
