
<div class="d-flex justify-content-center align-items-center flex-column" style="min-height: 100vh;">
    <h1 class="mb-4">Inscription</h1>
    <!-- Formulaire d'inscription-->
    <form (ngSubmit)="register()" #registerForm="ngForm" style="width: 66%; border: 3px solid #0d6efd; border-radius: 10px; padding: 2rem;">      
        <div class="profile-pic-wrapper d-flex justify-content-center mb-4">
            <div class="profile-pic-container position-relative" (click)="openModal()">
              <img 
                [src]="selectedProfilePic" 
                alt="Photo de profil" 
                class="rounded-circle profile-pic-img">
              <div class="overlay">
                <span>Modifier</span>
              </div>
            </div>
          </div>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Adresse Email</label>
        <input type="email" [(ngModel)]="registerData.mail" name="mail" class="form-control" id="inputEmail" aria-describedby="emailHelp">
      </div>    
      <div class="mb-3">
        <div class="d-flex gap-3">
          <div class="flex-fill">
            <label for="inputNom" class="form-label">Nom</label>
            <input type="text" [(ngModel)]="registerData.nom" name="nom" class="form-control" id="inputNom">
          </div>
          <div class="flex-fill">
            <label for="inputPrenom" class="form-label">Prénom</label>
            <input type="text" [(ngModel)]="registerData.prenom" name="prenom"  class="form-control" id="inputPrenom">
          </div>
        </div>
      </div>   
      <div class="mb-3">
        <label for="exampleInputPassword1"  class="form-label">Mot de Passe</label>
        <input type="password" [(ngModel)]="registerData.mdp" name="mdp" class="form-control" id="inputPassword1">
      </div>      
      <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>
  </div>
  
<!-- Modal de la photo de profil-->
<div *ngIf="isModalOpen" class="modal-backdrop" (click)="closeModal()">
    <div class="modal-dialog" (click)="$event.stopPropagation()">
      <div class="modal-content p-3">
        <div class="modal-header">
          <h5 class="modal-title">Choisir une photo</h5>
          <button type="button" class="btn-close" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <img 
              *ngFor="let pic of availablePics" 
              [src]="pic" 
              (click)="selectPic(pic)" 
              class="rounded-circle profile-pic-thumbnail"
              style="cursor: pointer;">
          </div>
        </div>
      </div>
    </div>
  </div>
