<div class="equipes-page container-fluid py-4 mt-5">

    <p *ngIf="!chargement && teams.length === 0" class="text-center text-muted">
      Aucune équipe pour l'instant. Crée ta première équipe avec le bouton +.
    </p>

    <div class="row">
      <div class="col-md-6 mb-4" *ngFor="let team of teams">
        <app-team-card [team]="team" (deleted)="onTeamDeleted($event)"></app-team-card>
      </div>
    </div>

    <!-- Bouton pour ajouter une équipe -->
    <button routerLink="/equipe-creation" class="btn btn-primary rounded-circle position-fixed"
            style="bottom: 20px; left: 20px; width: 50px; height: 50px; z-index: 999;">
      +
    </button>

</div>
